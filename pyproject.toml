[project]
name = "barcode-kit"
version = "0.1.0"
description = "A local GenBank-backed DNA barcode collection and build toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.83",
    "ete3>=3.1.3",
    "requests>=2.31",
    "six>=1.17",
    "typer>=0.12",
]

[project.scripts]
barcode-kit = "barcode_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
